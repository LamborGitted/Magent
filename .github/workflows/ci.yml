name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack and smoke-test the installed CLI
        shell: bash
        run: |
          tarball="$(npm pack --silent | tail -n 1)"
          prefix="$RUNNER_TEMP/magent-global"
          npm install --global "./$tarball" --prefix "$prefix"

          expected_version="$(node -p 'require("./package.json").version')"
          test "$("$prefix/bin/magent" --version)" = "$expected_version"
          "$prefix/bin/magent" --help >/dev/null

          export MAGENT_HOME="$RUNNER_TEMP/magent-smoke"
          "$prefix/bin/magent" env create smoke
          "$prefix/bin/magent" env info smoke --json >/dev/null
          "$prefix/bin/magent" env remove smoke --yes
